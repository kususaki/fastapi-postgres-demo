{% extends "base.html" %}

{% block title %}取引先一覧{% endblock %}

{% block content %}
<hgroup>
  <h1>取引先一覧</h1>
  <p>注文元の会社と、担当者・連絡先・注文実績を確認できます。</p>
</hgroup>

{# 絞り込みは htmx でサーバーに投げ、SQL の ILIKE で行う。 #}
<input
  type="search"
  name="q"
  placeholder="会社名・担当者・連絡先で絞り込み"
  aria-label="取引先を絞り込む"
  hx-get="/companies/rows"
  hx-trigger="input changed delay:300ms, search"
  hx-target="#company-rows"
/>

<div id="company-rows">{% include "_company_rows.html" %}</div>
{% endblock %}
